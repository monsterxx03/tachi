version: "2"

# 格式化也是一道门禁，不是编辑器里的顺手事。
#
# 从前这里只开 linters（govet / staticcheck / errcheck / ineffassign / unused），全是「检查器」——
# 而格式化漂移永远不会让任何一道门禁变红：`origin/main` 上曾经同时存在 23 个不是 gofmt 干净的
# .go 文件，`make lint` 一直绿，只能靠人眼发现。formatters 是 v2 才有的那一半，gofmt 进去之后
# `golangci-lint run`（也就是 make lint）会把它当问题报出来。
formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - govet          # Go 官方静态分析器，捕获真正的 bug，零噪音
    - staticcheck    # 综合性质量检查（v2 已合并 gosimple + stylecheck）
    - errcheck       # 检查未处理的 error 返回值
    - ineffassign    # 检测无效赋值（逻辑错误）
    - unused         # 保持代码库整洁，无死代码

  exclusions:
    rules:
      # 单测中忽略 errcheck
      - path: '(.+)_test\.go'
        linters:
          - errcheck

      # defer Close/Remove 是最常见的 Go 惯用法，错误通常不可操作
      - source: 'defer .*\.(Close|Remove)\(\)'
        linters:
          - errcheck

      # 非 defer 的 Close()（HTTP body、文件、连接、日志）同样是尽力而为的清理，错误极少可操作
      - source: '\.Close\(\)'
        linters:
          - errcheck

      # fmt.Fprint* 写到 stdout/writer 极少失败
      - source: 'fmt\.Fprint'
        linters:
          - errcheck

      # 编码输出到流 — 尽力而为
      - source: '\.Encode\('
        linters:
          - errcheck

      # 文件清理操作 — 尽力而为
      - source: 'os\.(Remove|Rename|MkdirAll)\('
        linters:
          - errcheck

      # 网络连接超时设置 — 极少失败
      - source: '\.Set(Write|Read)Deadline\('
        linters:
          - errcheck
