<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tachi 翻译</title>
  <style>
    :root {
      --bg: #1a202c;
      --surface: #2d3748;
      --border: #4a5568;
      --text: #e2e8f0;
      --text-secondary: #a0aec0;
      --accent: #4299e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      width: 480px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header .icon {
      font-size: 16px;
    }
    .header .title {
      font-weight: 600;
      font-size: 13px;
      flex: 1;
    }

    .content {
      padding: 12px 14px;
      overflow-y: auto;
      max-height: 400px;
      flex: 1;
    }

    .section-label {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .original-text {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--surface);
      border-radius: 6px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .translation-text {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 8px;
      padding: 10px 12px;
      background: rgba(66, 153, 225, 0.08);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 20px 14px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .loading .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      padding: 20px 14px;
      color: #fc8181;
      font-size: 13px;
      text-align: center;
    }

    .footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .btn-close {
      padding: 5px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
    }
    .btn-close:hover {
      background: var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">🌐</span>
    <span class="title">Tachi 翻译</span>
  </div>

  <div class="content" id="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>正在翻译…</span>
    </div>
  </div>

  <div class="footer">
    <button class="btn-close" id="btnClose" onclick="window.close()">关闭</button>
  </div>

  <script src="translate-popup.js"></script>
</body>
</html>
