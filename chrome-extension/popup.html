<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a202c;
      --surface: #2d3748;
      --border: #4a5568;
      --text: #e2e8f0;
      --text-secondary: #a0aec0;
      --accent: #4299e1;
      --success: #48bb78;
      --error: #fc8181;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 120px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .container { padding: 16px; }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .title { flex: 1; font-weight: 600; font-size: 16px; }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
    }
    .status-dot.connected { background: var(--success); }
    .status-dot.connecting {
      background: #ecc94b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn-summarize {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 12px;
    }
    .btn-summarize:hover { background: #3182ce; }
    .btn-summarize:active { transform: scale(0.98); }
    .btn-summarize:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-area {
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
      max-height: 400px;
      overflow-y: auto;
      display: none;
      word-break: break-word;
    }
    .result-area.visible { display: block; }
    .result-area .result-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .result-area .result-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .result-area a {
      color: var(--accent);
    }

    /* ── Markdown Content Styles ────────────────────────────────────── */

    .result-area h1, .result-area h2, .result-area h3, .result-area h4 {
      margin: 12px 0 6px;
      line-height: 1.3;
    }
    .result-area h1 { font-size: 16px; }
    .result-area h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .result-area h3 { font-size: 14px; }
    .result-area h4 { font-size: 13px; color: var(--text-secondary); }

    .result-area p { margin: 6px 0; }

    .result-area ul, .result-area ol {
      padding-left: 20px;
      margin: 6px 0;
    }
    .result-area li { margin: 2px 0; }

    .result-area code {
      font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      background: rgba(74, 85, 104, 0.4);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .result-area pre {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin: 8px 0;
      overflow-x: auto;
    }
    .result-area pre code {
      background: none;
      padding: 0;
      font-size: 12px;
      line-height: 1.5;
    }

    .result-area blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--text-secondary);
    }

    .result-area hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    .result-area table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12px;
    }
    .result-area th, .result-area td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }
    .result-area th {
      background: rgba(74, 85, 104, 0.3);
      font-weight: 600;
    }

    .result-area strong { font-weight: 600; color: #f0f4f8; }
    .result-area em { font-style: italic; }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-secondary);
    }
    .loading .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⚡</div>
      <span class="title">Tachi</span>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检测中…</span>
      </div>
    </div>

    <button class="btn-summarize" id="summarizeBtn">
      📄 总结当前页面
    </button>

    <div class="result-area" id="resultArea">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-meta" id="resultMeta"></div>
      <div id="resultContent"></div>
    </div>

    <div class="loading" id="loadingArea" style="display:none">
      <div class="spinner"></div>
      <div>正在分析页面内容…</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
