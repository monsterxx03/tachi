<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a202c;
      --surface: #2d3748;
      --border: #4a5568;
      --text: #e2e8f0;
      --text-secondary: #a0aec0;
      --accent: #4299e1;
      --success: #48bb78;
      --error: #fc8181;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .container { padding: 16px; }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .title {
      flex: 1;
      font-weight: 600;
      font-size: 16px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
    }
    .status-dot.connected {
      background: var(--success);
    }
    .status-dot.connecting {
      background: #ecc94b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 90px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .btn:hover {
      background: #4a5568;
      border-color: var(--accent);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    /* Input area */
    .input-area {
      margin-top: 12px;
    }
    .input-area textarea {
      width: 100%;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-area textarea:focus {
      border-color: var(--accent);
    }
    .input-area .btn {
      margin-top: 8px;
      width: 100%;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .input-area .btn:hover {
      background: #3182ce;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⚡</div>
      <span class="title">Tachi</span>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">连接中…</span>
      </div>
    </div>

    <div class="actions">
      <div class="action-row">
        <button class="btn" data-action="ask_tachi">🤖 问 Tachi</button>
        <button class="btn" data-action="explain">📖 解释</button>
      </div>
      <div class="action-row">
        <button class="btn" data-action="search">🔍 搜索</button>
        <button class="btn" data-action="remember">🧠 记住</button>
        <button class="btn" data-action="recall">🔎 回忆</button>
      </div>
    </div>

    <div class="input-area">
      <textarea id="queryInput" placeholder="输入问题或命令…"></textarea>
      <button class="btn" id="sendBtn">发送</button>
    </div>

    <div class="footer">
      <span id="connectionInfo">未连接</span>
      <a href="#" id="openPanel">打开侧边栏 →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
