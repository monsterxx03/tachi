<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tachi 面板</title>
  <style>
    :root {
      --bg: #1a202c;
      --surface: #2d3748;
      --border: #4a5568;
      --text: #e2e8f0;
      --text-secondary: #a0aec0;
      --accent: #4299e1;
      --success: #48bb78;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      flex: 1;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }
    .message {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
    .message.user {
      background: var(--accent);
      color: white;
      align-self: flex-end;
    }
    .message.assistant {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .input-row {
      display: flex;
      gap: 8px;
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding-top: 8px;
    }
    .input-row textarea {
      flex: 1;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      outline: none;
    }
    .input-row textarea:focus {
      border-color: var(--accent);
    }
    .input-row button {
      padding: 8px 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
    }
    .input-row button:hover {
      background: #3182ce;
    }
    .empty-state {
      color: var(--text-secondary);
      text-align: center;
      padding: 40px 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ Tachi</h1>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="empty-state">
      在页面上选中文本后右键使用 Tachi。<br>
      也可以在这里直接输入。
    </div>
  </div>

  <div class="input-row">
    <textarea id="input" placeholder="输入问题…" rows="1"></textarea>
    <button id="sendBtn">发送</button>
  </div>

  <script>
    const container = document.getElementById("chatContainer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    // Auto-resize textarea
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    // Send on Enter
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    sendBtn.addEventListener("click", send);

    function send() {
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      input.style.height = "auto";

      // Send query to Tachi via native messaging
      chrome.runtime.sendMessage({
        type: "sidepanel_query",
        content: text,
      }, (response) => {
        if (response && response.content) {
          addMessage("assistant", response.content);
        }
      });
    }

    function addMessage(role, content) {
      // Remove empty state
      const empty = container.querySelector(".empty-state");
      if (empty) empty.remove();

      const msg = document.createElement("div");
      msg.className = `message ${role}`;
      msg.textContent = content;
      container.appendChild(msg);
      msg.scrollIntoView({ behavior: "smooth" });
    }

    // Listen for results from background
    chrome.runtime.onMessage.addListener((msg) => {
      if (msg.type === "show_result" && msg.action === "ask_tachi") {
        addMessage("assistant", msg.content);
      }
    });
  </script>
</body>
</html>
