<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tachi</title>
<style>
  :root {
    --bg1: #0d1117;
    --bg2: #161b22;
    --fg: #e6edf3;
    --dim: #8b949e;
    --accent: #4fc3f7;
    --ok: #56d364;
    --err: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 50% 30%, var(--bg2), var(--bg1));
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #stage { position: relative; width: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas#face { width: 100%; height: 100%; display: block; cursor: pointer; }

  #statusbar {
    position: absolute; top: 12px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px; align-items: center;
    font-size: 13px; color: var(--dim); letter-spacing: 1px;
    z-index: 5; pointer-events: none;
  }
  #statusdot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: background .3s; }
  body.mood-listen #statusdot { background: var(--err); }
  body.mood-think #statusdot { background: #d29922; }
  body.mood-speak #statusdot { background: var(--ok); }

  #controls {
    width: 100%; max-width: 560px; padding: 14px 16px 20px;
    display: flex; flex-direction: column; gap: 10px; z-index: 10;
  }
  #talkbtn {
    height: 56px; border: none; border-radius: 28px;
    background: linear-gradient(135deg, #1f6feb, #388bfd);
    color: #fff; font-size: 17px; font-weight: 600; letter-spacing: 2px;
    cursor: pointer; touch-action: none; user-select: none;
    box-shadow: 0 4px 20px rgba(56, 139, 253, .35);
    transition: transform .1s, box-shadow .2s;
  }
  #talkbtn:active, body.mood-listen #talkbtn { transform: scale(.97); box-shadow: 0 2px 10px rgba(56,139,253,.5); }
  #talkbtn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  #inputrow { display: flex; gap: 8px; }
  #textin {
    flex: 1; height: 42px; padding: 0 14px; border-radius: 21px;
    border: 1px solid #30363d; background: #0d1117; color: var(--fg);
    font-size: 15px; outline: none;
  }
  #textin:focus { border-color: var(--accent); }
  #sendbtn {
    width: 58px; border: none; border-radius: 21px; background: #21262d;
    color: var(--fg); font-size: 15px; cursor: pointer;
  }
  #sendbtn:active { background: #30363d; }
  #tools { display: flex; gap: 8px; align-items: center; }
  #tools button {
    padding: 8px 14px; border-radius: 16px; border: 1px solid #30363d;
    background: #161b22; color: var(--dim); font-size: 13px; cursor: pointer;
  }
  #tools button.on { color: var(--accent); border-color: var(--accent); }
  #camwrap { position: relative; }
  video#cam { width: 120px; border-radius: 10px; border: 1px solid #30363d; transform: scaleX(-1); display: block; }
  #snap {
    position: absolute; right: 4px; bottom: 4px; width: 30px; height: 30px;
    border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.4);
    cursor: pointer;
  }

  #log {
    max-height: 130px; overflow-y: auto; padding: 10px 14px;
    background: rgba(13,17,23,.6); border: 1px solid #21262d; border-radius: 12px;
    font-size: 13.5px; line-height: 1.6; color: var(--fg);
    display: none;
  }
  #log .u { color: var(--accent); }
  #log .a { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
  #log .t { color: var(--dim); }
</style>
</head>
<body>

<div id="stage">
  <div id="statusbar"><span id="statusdot"></span><span id="statustext">待机中</span></div>
  <canvas id="face"></canvas>
</div>

<div id="controls">
  <button id="talkbtn" disabled>· · ·</button>
  <div id="inputrow">
    <input id="textin" placeholder="输入文字…" autocomplete="off">
    <button id="sendbtn">发送</button>
  </div>
  <div id="tools">
    <button id="cambtn">📷 摄像头</button>
    <div id="camwrap" style="display:none">
      <video id="cam" autoplay muted playsinline></video>
      <button id="snap" title="拍照让我看"></button>
    </div>
  </div>
  <div id="log"></div>
</div>

<script>
"use strict";

/* ---------- 状态 ---------- */
const moods = { IDLE: "idle", LISTEN: "listen", THINK: "think", SPEAK: "speak" };
let mood = moods.IDLE;
let moodTimer = null;
const setMood = (m, ms) => {
  mood = m;
  document.body.className = "mood-" + m;
  document.getElementById("statustext").textContent =
    m === moods.IDLE ? "待机中" : m === moods.LISTEN ? "聆听中…" : m === moods.THINK ? "思考中…" : "说话中…";
  clearTimeout(moodTimer);
  if (ms) moodTimer = setTimeout(() => setMood(moods.IDLE), ms);
};

/* ---------- 眼睛 ---------- */
const canvas = document.getElementById("face");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
const target = { x: 0, y: 0 };   // 视线目标（跟随鼠标）
const pupil = { x: 0, y: 0 };    // 瞳孔实际位置（缓动）
let blink = 1;                   // 1=睁眼，接近0=闭眼
let blinkAt = Date.now() + 2500;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
}
window.addEventListener("resize", resize); resize();

window.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect();
  target.x = ((e.clientX - r.left) / r.width - 0.5) * 2;   // -1..1
  target.y = ((e.clientY - r.top) / r.height - 0.5) * 2;
});
window.addEventListener("pointerleave", () => { target.x = 0; target.y = 0; });

function tickBlink(now) {
  if (now < blinkAt) return;
  // 眨眼：快速闭 0.12s 再睁开
  blink = 0.05;
  setTimeout(() => { blink = 1; }, 120);
  blinkAt = now + 2000 + Math.random() * 4000;
}

function drawEye(cx, cy, rx, ry) {
  const squint = mood === moods.THINK ? 0.75 : 1;
  const scaleY = Math.max(blink * squint, 0.05);

  // 视线偏移（思考时看向右上）
  let tx = target.x, ty = target.y;
  if (mood === moods.THINK) { tx = 0.7; ty = -0.6; }
  if (mood === moods.SPEAK) { tx = pupil.x * 0.4; ty = pupil.y * 0.4; }

  // 缓动
  pupil.x += (tx - pupil.x) * 0.12;
  pupil.y += (ty - pupil.y) * 0.12;

  // 眼白
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry * scaleY, 0, 0, Math.PI * 2);
  ctx.fillStyle = "#f5f7fa";
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, rx * 0.06);
  ctx.strokeStyle = "rgba(0,0,0,.55)";
  ctx.stroke();

  // 虹膜 + 瞳孔
  const ix = cx + pupil.x * rx * 0.5;
  const iy = cy + pupil.y * ry * 0.45;
  const ir = rx * 0.42;
  const g = ctx.createRadialGradient(ix - ir * 0.3, iy - ir * 0.3, ir * 0.1, ix, iy, ir);
  g.addColorStop(0, "#8ee6ff");
  g.addColorStop(0.6, "#38bdf8");
  g.addColorStop(1, "#0e7490");
  ctx.beginPath();
  ctx.ellipse(ix, iy, ir, ir * scaleY, 0, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ix + pupil.x * rx * 0.1, iy + pupil.y * ry * 0.08, ir * 0.42, 0, Math.PI * 2);
  ctx.fillStyle = "#0b1220";
  ctx.fill();
  // 高光
  ctx.beginPath();
  ctx.arc(ix - ir * 0.35, iy - ir * 0.35, ir * 0.16, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.fill();

  // 上眼睑（眨眼时压下来）
  if (scaleY < 0.95) {
    ctx.fillStyle = "#0d1117";
    ctx.fillRect(cx - rx * 1.3, cy - ry * 1.6, rx * 2.6, ry * (1.6 - scaleY) + ry * 0.2);
  }
}

function draw() {
  const now = Date.now();
  tickBlink(now);

  const cx1 = W * 0.36, cx2 = W * 0.64;
  const cy = H * 0.42;
  const rx = Math.min(W * 0.09, H * 0.1);
  const ry = rx * 1.15;

  ctx.clearRect(0, 0, W, H);

  // 思考时的“皱眉”和说话时的“微笑眉”由眉毛表达
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(230,237,243,.85)";
  ctx.lineWidth = Math.max(3, rx * 0.13);
  for (const cx of [cx1, cx2]) {
    let y = cy - ry * 1.55;
    let a1 = Math.PI * 0.95, a2 = Math.PI * 1.05;
    if (mood === moods.THINK) { a1 = Math.PI * 1.12; a2 = Math.PI * 1.05; y += ry * 0.15; }
    ctx.beginPath();
    ctx.arc(cx, y, rx * 0.9, a1, a2);
    ctx.stroke();
  }

  drawEye(cx1, cy, rx, ry);
  drawEye(cx2, cy, rx, ry);

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- 语音识别 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const talkbtn = document.getElementById("talkbtn");

function startListen() {
  if (!SR) { setStatusText("此浏览器不支持语音识别，请用文字输入"); return; }
  try {
    if (!rec) {
      rec = new SR();
      rec.lang = "zh-CN";
      rec.interimResults = false;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      rec.onresult = e => {
        const text = e.results[0][0].transcript.trim();
        if (text) sendChat(text);
      };
      rec.onerror = e => { setStatusText("语音错误: " + e.error); setMood(moods.IDLE); };
      rec.onend = () => { listening = false; talkbtn.textContent = "按住说话"; setMood(moods.IDLE); };
    }
    rec.start();
    listening = true;
    talkbtn.textContent = "松开结束";
    setMood(moods.LISTEN);
  } catch (e) {
    setStatusText("语音启动失败，请用文字");
  }
}

function stopListen() {
  if (rec && listening) { try { rec.stop(); } catch (e) {} }
}

function setStatusText(t) {
  document.getElementById("statustext").textContent = t;
  setTimeout(() => { if (document.getElementById("statustext").textContent === t) setStatusText("待机中"); }, 4000);
}

/* ---------- 聊天 ---------- */
const logEl = document.getElementById("log");

function appendLog(role, text) {
  logEl.style.display = "block";
  const div = document.createElement("div");
  if (role === "u") div.innerHTML = "<span class='u'>你：</span>" + escapeHtml(text);
  else if (role === "a") div.innerHTML = "<span class='a'>我：</span><span class='a'>" + escapeHtml(text) + "</span>";
  else div.innerHTML = "<span class='t'>" + escapeHtml(text) + "</span>";
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function sendChat(text) {
  appendLog("u", text);
  talkbtn.disabled = true;
  setMood(moods.THINK);
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || "agent 错误");
    appendLog("a", data.reply);
    setMood(moods.SPEAK, Math.min(2000 + data.reply.length * 40, 8000));
    speak(data.reply);
  } catch (e) {
    appendLog("t", "出错：" + e.message);
    setMood(moods.IDLE);
  } finally {
    talkbtn.disabled = false;
    talkbtn.textContent = "按住说话";
  }
}

/* ---------- TTS ---------- */
let zhVoices = [];
function loadVoices() { zhVoices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("zh")); }
if (speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*#`>\n]+/g, " "));
  u.lang = "zh-CN";
  if (zhVoices.length) u.voice = zhVoices[0];
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

/* ---------- 摄像头 ---------- */
let camStream = null;
const cambtn = document.getElementById("cambtn");
const camwrap = document.getElementById("camwrap");
const cam = document.getElementById("cam");

cambtn.addEventListener("click", async () => {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null; camwrap.style.display = "none";
    cambtn.classList.remove("on"); cambtn.textContent = "📷 摄像头";
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    cam.srcObject = camStream;
    camwrap.style.display = "block";
    cambtn.classList.add("on"); cambtn.textContent = "📷 关闭";
  } catch (e) {
    setStatusText("摄像头不可用: " + e.message);
  }
});

document.getElementById("snap").addEventListener("click", async () => {
  if (!camStream) return;
  const c = document.createElement("canvas");
  c.width = cam.videoWidth; c.height = cam.videoHeight;
  c.getContext("2d").drawImage(cam, 0, 0);
  c.toBlob(async blob => {
    const fd = new FormData();
    fd.append("image", blob, "camera.jpg");
    fd.append("message", "看看我，描述一下你看到的画面。");
    appendLog("u", "[📷 拍照请求]");
    talkbtn.disabled = true;
    setMood(moods.THINK);
    try {
      const resp = await fetch("/api/vision", { method: "POST", body: fd });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || "vision 错误");
      appendLog("a", data.reply);
      setMood(moods.SPEAK, Math.min(2000 + data.reply.length * 40, 8000));
      speak(data.reply);
    } catch (e) {
      appendLog("t", "出错：" + e.message);
      setMood(moods.IDLE);
    } finally {
      talkbtn.disabled = false;
      talkbtn.textContent = "按住说话";
    }
  }, "image/jpeg", 0.85);
});

/* ---------- 事件绑定 ---------- */
talkbtn.addEventListener("pointerdown", e => { e.preventDefault(); if (!talkbtn.disabled) startListen(); });
window.addEventListener("pointerup", stopListen);
window.addEventListener("pointercancel", stopListen);
document.getElementById("sendbtn").addEventListener("click", () => {
  const v = document.getElementById("textin").value.trim();
  if (!v) return;
  document.getElementById("textin").value = "";
  sendChat(v);
});
document.getElementById("textin").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("sendbtn").click();
});

/* ---------- 启动检查 ---------- */
if (!SR) talkbtn.textContent = "浏览器不支持语音";
else talkbtn.disabled = false;
if (!("speechSynthesis" in window)) setStatusText("此浏览器不支持语音合成");
</script>
</body>
</html>
