name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="tachi-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags="-X main.Version=${{ github.ref_name }} -X github.com/monsterxx03/tachi/llm.Version=${{ github.ref_name }}" -o "$BINARY" .
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tachi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tachi-${{ matrix.goos }}-${{ matrix.goarch }}

  create-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tachi-*
          path: .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            tachi-linux-amd64/tachi-linux-amd64
            tachi-linux-arm64/tachi-linux-arm64
            tachi-darwin-amd64/tachi-darwin-amd64
            tachi-darwin-arm64/tachi-darwin-arm64
