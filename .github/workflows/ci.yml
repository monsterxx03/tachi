name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/frontend/dist is gitignored and embedded via //go:embed dist, so
      # build it before any Go compile (go test ./... covers web/frontend).
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # The web console's eslint, in the job that already installed its deps (web-build
      # above). It lives on `make web-lint` so this and `make lint` are one definition.
      - name: Lint web frontend
        run: make web-lint

      - name: Test
        run: go test ./...

  # The race detector. `go test ./...` above cannot see a data race at all, and both races this
  # repo has actually found were visible ONLY here (node/peerlist_test.go's reachable flag,
  # mobile/mockapi's sessionID). Scoped to the packages that START goroutines — agent, node,
  # session, channel, cron, the mock server, pkg and the two frontends' backends — because
  # `-race ./...` doubles the whole matrix to catch the same shape in code that never spawns one.
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A Go compile of this module needs dist/ in place (see the test job).
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Race detector
        run: go test -race ./agent/... ./node/ ./session/ ./channel/... ./cron/ ./mobile/mockapi/ ./pkg/... ./tui/ ./web/

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/frontend/dist is gitignored and embedded via //go:embed dist.
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o tachi .

  # The no-window host (desktop/ with `-tags headless`). It is the one build that proves the phone
  # interface does not need a desktop: no cgo, so no gtk/webkit headers, and a static binary comes
  # out. Cheap enough to run on every push, and the only guard that build has (desktop's own tests
  # run under the default tag).
  desktop-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build the headless host
        working-directory: desktop
        run: CGO_ENABLED=0 go build -tags headless -trimpath -o /tmp/tachi-headless .

  # 两个前端，上面没有一个 job 会碰它们：桌面那套 bundle 只在 macOS 的 `make build` 里编，
  # 手机那套在 runner 上根本不编 —— 所以任何一边的类型错误或坏掉的单测合并时都是静默的，
  # 过几天才在某个把应用跑起来的人那里炸。`tsc` 几秒钟就能挡住绝大部分，桌面这边再多跑一步
  # `vite build`，因为它就是 `make build` 跑的那条命令。
  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install dependencies
        working-directory: desktop/frontend
        run: npm ci

      # tsc, then the production bundle — the same command `make -C desktop frontend` runs.
      - name: Type-check and build
        working-directory: desktop/frontend
        run: npm run build

  # 手机那半边：它的单测（jest，15 个套件）和它的 TypeScript。**Node 22，不是上面那些 job 用的 20** ——
  # React Native 0.88 的 engines 是 ^22.13 || ^24.3 || >=26，20 会在装依赖时以 EBADENGINE 起步，
  # 而且报错的位置跟真正的原因毫不相干（docs/agents/mobile.md）。
  mobile:
    runs-on: ubuntu-latest
    # 那两个套件（`time.test.ts` / `cronSchedule.test.ts`）的时间断言是按 +08:00 写的：它们验的是
    # 「本地怎么显示」，而 runner 是 UTC，于是同一条断言在两种机器上给出两种答案。这里钉住 fixture
    # 当初的那个时区让门禁先跑起来；真正该改的是那几条断言（用本地分量造时间戳，见 issue #125）。
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type-check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: mobile
        run: npx jest --ci

  # Integration tests (docs/2026-07-31-tui-integration-test.md): `make itest`
  # runs the five suites in parallel (-j5) — mockllm contract tests, itest/run
  # (-p pipe, real binary), itest/tui (in-process bubbletea: real Model +
  # real AIAgent), itest/acp (real binary + ACP SDK), itest/headless (the
  # desktop module's no-window host: real binary, real HTTP/WS, no GUI and no
  # cgo) — the first four with ginkgo -p spec parallelism (ITEST_PROCS=4).
  # Specs own isolated homes/mocks, so the whole thing is hermetic;
  # run/acp build the real binary once per suite.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/frontend/dist is gitignored and embedded via //go:embed dist; the
      # itest harness (itest/run, itest/acp) compiles the real binary, so the
      # frontend must exist before `make itest`.
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Integration tests
        run: make itest