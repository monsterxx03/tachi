name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/frontend/dist is gitignored and embedded via //go:embed dist, so
      # build it before any Go compile (go test ./... covers web/frontend).
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Test
        run: go test ./...

  # The race detector. `go test ./...` above cannot see a data race at all, and both races this
  # repo has actually found were visible ONLY here (node/peerlist_test.go's reachable flag,
  # mobile/mockapi's sessionID). Scoped to the packages that START goroutines — agent, node,
  # session, channel, cron, the mock server, pkg and the two frontends' backends — because
  # `-race ./...` doubles the whole matrix to catch the same shape in code that never spawns one.
  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A Go compile of this module needs dist/ in place (see the test job).
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Race detector
        run: go test -race ./agent/... ./node/ ./session/ ./channel/... ./cron/ ./mobile/mockapi/ ./pkg/... ./tui/ ./web/

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/frontend/dist is gitignored and embedded via //go:embed dist.
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o tachi .

  # The no-window host (desktop/ with `-tags headless`). It is the one build that proves the phone
  # interface does not need a desktop: no cgo, so no gtk/webkit headers, and a static binary comes
  # out. Cheap enough to run on every push, and the only guard that build has (desktop's own tests
  # run under the default tag).
  desktop-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build the headless host
        working-directory: desktop
        run: CGO_ENABLED=0 go build -tags headless -trimpath -o /tmp/tachi-headless .

  # Integration tests (docs/2026-07-31-tui-integration-test.md): `make itest`
  # runs the five suites in parallel (-j5) — mockllm contract tests, itest/run
  # (-p pipe, real binary), itest/tui (in-process bubbletea: real Model +
  # real AIAgent), itest/acp (real binary + ACP SDK), itest/headless (the
  # desktop module's no-window host: real binary, real HTTP/WS, no GUI and no
  # cgo) — the first four with ginkgo -p spec parallelism (ITEST_PROCS=4).
  # Specs own isolated homes/mocks, so the whole thing is hermetic;
  # run/acp build the real binary once per suite.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/frontend/dist is gitignored and embedded via //go:embed dist; the
      # itest harness (itest/run, itest/acp) compiles the real binary, so the
      # frontend must exist before `make itest`.
      - name: Build web frontend
        uses: ./.github/actions/web-build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Integration tests
        run: make itest