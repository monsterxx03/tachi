version: '3'

includes:
  common: ../Taskfile.yml

# macOS only, and natively so: there is no cross-compile branch (the docker image this template
# shipped with was removed — see docs/agents/desktop.md).

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: build:universal:lipo

  # lipo is a macOS tool and there is no non-macOS path left to build a darwin binary on, so this
  # is the template's `build:universal:lipo:native` / `…:lipo:go` pair collapsed into one.
  build:universal:lipo:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle

  package:dmg:
    summary: Packages the application into a styled `.dmg`
    deps:
      - task: package
    cmds:
      - task: create:dmg

  # package:pkg is the INSTALLER: one .pkg that puts the app in /Applications and the CLI in
  # /usr/local/bin, which is what makes `tachi` reachable from a terminal after installing (a bundle
  # alone never joins PATH). `make -C desktop package` calls create:pkg directly instead — see the
  # comment there for why that skips a rebuild.
  #
  # A `.dmg` and a `.pkg` answer different questions: the dmg is "drag the app in" (no CLI on PATH),
  # the pkg is "install both".
  package:pkg:
    summary: Packages the app AND the CLI into one installer (.pkg)
    platforms: [darwin]
    deps:
      - task: package
    cmds:
      - task: create:pkg

  # create:pkg builds the installer itself, with no build dependency on purpose: the caller decides
  # whether the .app in bin/ is the freshly dressed one (make build ⇒ local-identity signed) or a
  # rebuild. `make -C desktop package` therefore calls THIS after its own build.
  #
  # Two payloads, one installer:
  #   · the app, through `pkgbuild --component` (the form for a BUNDLE; --root describes a bare file
  #     tree). It must ALREADY be signed — whatever signature it carries is what ships, and this
  #     step adds none.
  #   · the CLI, through `pkgbuild --root` of a staging dir, landing at /usr/local/bin/tachi — the
  #     same path the Linux package uses, so the two platforms answer the same way.
  # `productbuild` merges them and synthesizes the distribution XML (no Distribution file to keep in
  # sync).
  #
  # The .pkg is NOT signed: productsign needs a "Developer ID Installer" certificate, which is not
  # the code-signing identity the app is signed with (and is not something a dev machine has). An
  # unsigned pkg installs fine locally; distributing one needs that certificate plus notarization.
  create:pkg:
    summary: Builds the installer (.pkg) — app into /Applications, CLI into /usr/local/bin
    platforms: [darwin]
    cmds:
      - rm -rf "{{.BIN_DIR}}/pkg-stage"
      - mkdir -p "{{.BIN_DIR}}/pkg-stage/usr/local/bin"
      - cp "{{.BIN_DIR}}/tachi" "{{.BIN_DIR}}/pkg-stage/usr/local/bin/tachi"
      - pkgbuild --component "{{.BIN_DIR}}/{{.APP_NAME}}.app" --install-location /Applications
        --identifier com.monsterxx03.tachi --version "{{.PKG_VERSION}}"
        "{{.BIN_DIR}}/tachi-app.pkg"
      - pkgbuild --root "{{.BIN_DIR}}/pkg-stage" --install-location /
        --identifier com.monsterxx03.tachi.cli --version "{{.PKG_VERSION}}"
        "{{.BIN_DIR}}/tachi-cli.pkg"
      - productbuild --package "{{.BIN_DIR}}/tachi-app.pkg" --package "{{.BIN_DIR}}/tachi-cli.pkg"
        "{{.BIN_DIR}}/{{.APP_NAME}}-{{.PKG_VERSION}}.pkg"
      - rm -f "{{.BIN_DIR}}/tachi-app.pkg" "{{.BIN_DIR}}/tachi-cli.pkg"
      - rm -rf "{{.BIN_DIR}}/pkg-stage"
    vars:
      # The version the installer reports is the one the binaries carry (the ROOT Makefile's
      # `git describe`), so `pkgutil --pkg-info` and `tachi --version` agree. pkgbuild refuses an
      # empty --version, hence the fallback for a checkout without git.
      PKG_VERSION:
        sh: 'v=$(git describe --tags --always 2>/dev/null); echo "${v:-0.0.0}" | sed "s/^v//"'

  create:dmg:
    summary: Creates a configurable `.dmg` from the `.app` bundle
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.APP_NAME}}" --out "{{.BIN_DIR}}"
        --background "{{.DMG_BACKGROUND}}"
        --volume-icon "{{.DMG_VOLUME_ICON}}"
        --file-icon "{{.DMG_FILE_ICON}}"
        --window-width "{{.DMG_WINDOW_WIDTH}}"
        --window-height "{{.DMG_WINDOW_HEIGHT}}"
        {{if .DMG_FILES}}--files "{{.DMG_FILES}}"{{end}}
    vars:
      DMG_BACKGROUND: '{{.DMG_BACKGROUND | default "build/darwin/dmg-background.png"}}'
      DMG_VOLUME_ICON: '{{.DMG_VOLUME_ICON | default "build/darwin/icons.icns"}}'
      DMG_FILE_ICON: '{{.DMG_FILE_ICON | default "build/darwin/dmg-file-icon.icns"}}'
      DMG_WINDOW_WIDTH: '{{.DMG_WINDOW_WIDTH | default "540"}}'
      DMG_WINDOW_HEIGHT: '{{.DMG_WINDOW_HEIGHT | default "380"}}'
      DMG_FILES: '{{.DMG_FILES | default ""}}'


  create:app:bundle:
    summary: Creates an `.app` bundle
    deps:
      # The CLI/TUI ships INSIDE the bundle (Contents/MacOS/tachi below), so it is built as part of
      # assembling the bundle — the one place `package`, `package:universal` and `package:dmg` all
      # come through. Same binary as the Linux package's /usr/local/bin/tachi: build:cli is shared.
      - task: common:build:cli
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      # The CLI, WITHOUT a .app suffix and with its own plain name: it is a terminal command, not a
      # second launcher — CFBundleExecutable (`tachi-desktop`) still names the app's own binary.
      #
      # It also has to differ from that binary by MORE than case: macOS's filesystem is
      # case-INSENSITIVE, so an app binary called `Tachi` would be the SAME file as this `tachi` and
      # the two would overwrite each other (in bin/ as well as in here). That is why APP_NAME is
      # `tachi-desktop` — see its comment in the parent Taskfile.
      #
      # The order is load-bearing: this must come BEFORE codesign:adhoc (or before the Makefile's
      # local-identity re-sign, which runs after `wails3 package`). A bundle is signed as a whole, so
      # a file added afterwards leaves the seal matching a file list that no longer exists.
      - cp "{{.BIN_DIR}}/tachi" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/tachi"
      - task: codesign:adhoc

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle
    internal: true
    cmds:
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  run:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Uses signing identity from `wails3 setup` (stored in ~/.config/wails/defaults.yaml).
      Override with: task darwin:sign -- --identity "Developer ID Application: ..."
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" {{.CLI_ARGS}}

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Uses signing identity and keychain profile from `wails3 setup`.

      First-time setup:
        wails3 setup
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --notarize {{.CLI_ARGS}}
