# This file contains the configuration for this project.
# `info` is the source of the values the generated platform assets carry (macOS Info.plist chief
# among them, and that one is hand-edited — see build/darwin/Info.plist).
# NOTE: `wails3 update build-assets` is NOT a task here and must not be run: it extracts wails's
# whole asset tree over build/, bringing back the platform scaffolds this project dropped
# (windows/, ios/, android/) and overwriting the hand-edited platform Taskfiles.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "monsterxx03" # The name of the company
  productName: "Tachi" # The name of the application
  productIdentifier: "com.monsterxx03.tachi.desktop" # The unique product identifier
  description: "Tachi — AI Agent desktop companion" # The application description
  copyright: "(c) 2026, Tachi" # Copyright text
  comments: "Tachi" # Comments
  version: "0.1.0" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# The template's commented-out `ios:` section is gone along with the iOS target — see
# docs/agents/desktop.md ("桌面构建与签名").

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
#  - ext: wails
#    name: Wails
#    description: Wails Application File
#    iconName: wailsFileIcon
#    role: Editor
#  - ext: jpg
#    name: JPEG
#    description: Image File
#    iconName: jpegFileIcon
#    role: Editor
#    mimeType: image/jpeg  # (optional)

# Other data
other:
  - name: My Other Data