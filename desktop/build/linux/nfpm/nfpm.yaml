# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

# The PACKAGE name — what `pacman -Q` / `dpkg -l` / `rpm -q` answer, and deliberately NOT the
# executable's name: the binary, the .desktop file and the icon all stay `tachi-desktop` (this
# file's `contents:` says so, and so does the .desktop's Exec). Kept in step with PKG_NAME in
# build/linux/Taskfile.yml BY HAND, because nfpm reads this file directly and cannot see that
# variable — and the two must agree, or an artifact is named after something its package is not.
name: "tachi.desktop"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
# Written literally rather than from ${GIT_COMMITTER_NAME}/${GIT_COMMITTER_EMAIL} (the template's
# form): those are only set when the build runs from a git hook, so a plain `make package` shipped a
# package with an EMPTY Maintainer field — which dpkg reports as a malformed control file. The
# maintainer of a package is the project's, not whoever happens to be building it.
maintainer: "monsterxx03 <xyj.asmy@gmail.com>"
description: "Tachi — AI Agent desktop app (tachi-desktop) and CLI/TUI (tachi)"
vendor: "monsterxx03"
homepage: "https://github.com/monsterxx03/tachi"
license: "MIT"
release: "1"

contents:
  - src: "./bin/tachi-desktop"
    dst: "/usr/local/bin/tachi-desktop"
  # The CLI/TUI rides in the same package: one project, one install step. It is built by the Linux
  # Taskfile's build:cli (desktop/Makefile's `cli`) — the ROOT module's binary, version-stamped and
  # with the web console embedded. `/usr/local/bin` because that is where this package already puts
  # the desktop binary, and it is on PATH.
  - src: "./bin/tachi"
    dst: "/usr/local/bin/tachi"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/tachi-desktop.png"
  - src: "./build/linux/tachi-desktop.desktop"
    dst: "/usr/share/applications/tachi-desktop.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Arch-only metadata: without it nfpm writes `packager = Unknown Packager` into .PKGINFO
# (its default — nfpm v2.44 has no top-level packager field).
archlinux:
  packager: "monsterxx03 <xyj.asmy@gmail.com>"

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
