version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # APP_NAME is deliberately NOT overridden here any more. It used to be ("tachi-desktop", because
  # the parent Taskfile called the artifact "Tachi") — but a Taskfile's top-level vars are merged
  # into the GLOBAL scope, and this file is included AFTER darwin, so that override silently renamed
  # macOS's bundle as well: bin/Tachi.app became bin/tachi-desktop.app, whose Info.plist still named
  # a `Tachi` executable that was no longer there. The one artifact name both platforms use is now
  # declared in the parent Taskfile — see the comment on APP_NAME there.

  # PKG_NAME is the distro PACKAGE name (deb `Package:`, rpm `Name:`, Arch `pkgname`) and what the
  # artifacts are named after. It is not APP_NAME on purpose: the package is `tachi.desktop` while
  # the executable, the .desktop file and the icon are `tachi-desktop`. Kept in step with
  # nfpm.yaml's `name:` BY HAND — nfpm reads that file directly and cannot see this variable.
  PKG_NAME: "tachi.desktop"

  # Signing configuration - edit these values for your project
  # PGP_KEY: "path/to/signing-key.asc"
  # SIGN_ROLE: "builder"  # Options: origin, maint, archive, builder
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      # The CLI/TUI rides in the SAME package (nfpm's contents installs bin/tachi next to
      # tachi-desktop), so it is built as part of `build` rather than by a step of its own: every
      # path that packages — including the three `create:*` tasks when invoked directly — comes
      # through here, and no one has to remember the extra step. The recipe lives in the COMMON
      # Taskfile (build:cli), shared with darwin, whose bundle carries the same binary.
      - task: common:build:cli
    preconditions:
      # Linux needs CGO (gtk/webkit), and the docker fallback this template shipped with is gone
      # (see docs/agents/desktop.md), so the compiler is now a hard prerequisite — a missing one
      # deserves a sentence rather than a linker error.
      - sh: 'wails3 tool has "gcc|clang"'
        msg: "A C compiler (cgo) is required: install gcc or clang, plus the webkit2gtk/gtk3 development packages."
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      # Deliberately NOT `common:generate:icons` (it rewrites build/darwin/icons.icns, which is this
      # platform's nothing) and NOT `generate:dotdesktop`
      # (it would overwrite build/linux/tachi-desktop.desktop, whose StartupWMClass=org.wails.tachi
      # line is load-bearing and is not something the generator knows — see docs/agents/desktop.md).
      # The AppImage's own icon is build/appicon.png, copied below, and nfpm installs that same PNG.
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    # The three formats nfpm writes with no host tooling: Debian, RPM, Arch. `package:appimage` is
    # deliberately NOT in this list — linuxdeploy's GTK plugin assumes a Debian-ish gdk-pixbuf
    # layout (`/usr/lib/<arch>/gdk-pixbuf-2.0/2.10.0`) that Arch-family hosts do not have, so
    # bundling there fails after ~10s of work with "Failed to run plugin: gtk". Run it on a host
    # where it can work: `wails3 task linux:package:appimage`.
    summary: Packages the application for Linux (deb / rpm / arch)
    deps:
      - task: build
    cmds:
      - task: create:deb
      - task: create:rpm
      - task: create:aur

  package:appimage:
    summary: Creates an AppImage (host-dependent — see the note on `package`)
    deps:
      - task: build
    cmds:
      - task: create:appimage

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
    cmds:
      - cp "{{.APP_BINARY}}" "{{.APP_NAME}}"
      - cp ../../appicon.png "{{.APP_NAME}}.png"
      - wails3 generate appimage -binary "{{.APP_NAME}}" -icon {{.ICON}} -desktopfile {{.DESKTOP_FILE}} -outputdir {{.OUTPUT_DIR}} -builddir {{.ROOT_DIR}}/build/linux/appimage/build
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}.png'
      DESKTOP_FILE: '../{{.APP_NAME}}.desktop'
      OUTPUT_DIR: '../../../bin'

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
    cmds:
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
    cmds:
      - task: generate:rpm

  create:aur:
    summary: Creates a arch linux packager package
    deps:
      - task: build
    cmds:
      - task: generate:aur

  generate:deb:
    summary: Creates a deb package
    cmds:
      - wails3 tool package -name "{{.PKG_NAME}}" -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:rpm:
    summary: Creates a rpm package
    cmds:
      - wails3 tool package -name "{{.PKG_NAME}}" -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:aur:
    summary: Creates a arch linux packager package
    cmds:
      - wails3 tool package -name "{{.PKG_NAME}}" -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  sign:deb:
    summary: Signs the DEB package
    desc: |
      Signs the .deb package with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:deb
    cmds:
      # PGP_KEY is optional: if unset, `wails3 tool sign` falls back to the key
      # configured globally via `wails3 setup`.
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.deb" {{if .PGP_KEY}}--pgp-key "{{.PGP_KEY}}"{{end}} {{if .SIGN_ROLE}}--role "{{.SIGN_ROLE}}"{{end}}

  sign:rpm:
    summary: Signs the RPM package
    desc: |
      Signs the .rpm package with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:rpm
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}*.rpm" {{if .PGP_KEY}}--pgp-key "{{.PGP_KEY}}"{{end}}

  sign:packages:
    summary: Signs all Linux packages (DEB and RPM)
    desc: |
      Signs both .deb and .rpm packages with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    cmds:
      - task: sign:deb
      - task: sign:rpm
