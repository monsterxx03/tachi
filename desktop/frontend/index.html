<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Theme boot. Resolves the stored choice (else the system preference) and
         stamps it on <html> while the document is still parsing — the inline
         script is deliberate: a module/deferred script would run after the
         first paint, which is exactly the white flash this avoids. Go decides
         the window's pre-paint colour from the same choice (desktop/uitheme.go);
         this decides the first painted frame. Keep the storage key in sync with
         STORAGE_KEY in src/theme.ts. -->
    <script>
      (function () {
        var theme
        try {
          var stored = localStorage.getItem('tachi.desktop.theme')
          theme = stored === 'light' || stored === 'dark' ? stored : null
        } catch (e) {
          theme = null // storage blocked → fall through to the system preference
        }
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="stylesheet" href="/base.css" />
    <link rel="stylesheet" href="/layout.css" />
    <link rel="stylesheet" href="/chat.css" />
    <link rel="stylesheet" href="/widgets.css" />
    <link rel="stylesheet" href="/overlays.css" />
    <link rel="stylesheet" href="/settings.css" />
    <link rel="stylesheet" href="/cron.css" />
    <!-- Reading-size boot, for the same reason as the theme above: --fs-scale is a variable the
         first painted frame has to carry already, or a restored transcript draws at the default
         size and then jumps a moment later. This webview's own copy is localStorage — the durable
         record is desktop_ui.json, written by Go when the reader presses ⌘= / ⌘- / ⌘0 (see
         src/fontsize.ts for the whole picture, and keep this key in sync with STORAGE_KEY there;
         the bounds are fontsize.ts's MIN/MAX as well). -->
    <script>
      (function () {
        try {
          var pct = parseInt(localStorage.getItem('tachi.desktop.fontScale') || '', 10)
          if (pct >= 80 && pct <= 160) {
            document.documentElement.style.setProperty('--fs-scale', String(pct / 100))
          }
        } catch (e) {
          /* storage blocked → the stylesheet's own size */
        }
      })()
    </script>
    <title>Tachi Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
