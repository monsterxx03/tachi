version: '3'

vars:
  # APP_NAME names the ARTIFACT on both desktop platforms — the binary `bin/<APP_NAME>` and, on
  # macOS, the bundle `<APP_NAME>.app` (whose DIRECTORY name is what Finder and the Dock display).
  # It is NOT the user-visible product name: that one is "Tachi", and it lives in
  # build/darwin/Info.plist (CFBundleName/CFBundleDisplayName) and build/config.yml.
  #
  # Why lowercase-and-hyphenated rather than "Tachi": macOS's filesystem is case-INSENSITIVE, so an
  # app binary named "Tachi" and the CLI "tachi" (both built into this same bin/) would be the SAME
  # file — whichever is built last silently overwrites the other. The name must also equal the
  # bundle's CFBundleExecutable, or the .app cannot launch at all.
  #
  # This is the ONE place the name is declared: a Taskfile that overrode it (as build/linux used to)
  # has its top-level vars merged into the GLOBAL scope, which silently renamed the OTHER platform's
  # artifacts too. Keep in step by hand with build/darwin/Info.plist (CFBundleExecutable) and
  # itest/desktop/sandbox_*.go (defaultAppPath) — nothing enforces the three agreeing.
  APP_NAME: "tachi-desktop"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run; it picks which platform Taskfile the tasks below dispatch to.
  # Defaults to the host OS, and that is the only value that works: there are exactly two targets
  # — darwin and linux — and each one is built NATIVELY (macOS needs the macOS SDK and codesign,
  # Linux needs cgo + gtk/webkit headers), so there is no cross-compile fallback left to switch to.
  GOOS: '{{.GOOS | default OS}}'

# Only the two platforms this project ships are included. The other scaffolds the wails template
# generates (windows/, ios/, android/) used to be here, along with a docker cross-compilation path
# (`setup:docker`, and each platform's `build:docker` branch) — all removed on purpose, see
# docs/agents/desktop.md ("桌面构建与签名"). Note `wails3 update build-assets` would put every one
# of them back.
includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  # NB: the `build:docker` / `run:docker` below are SERVER mode (build/docker/Dockerfile.server —
  # an HTTP-only image) and have nothing to do with cross-compiling the desktop app.

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
